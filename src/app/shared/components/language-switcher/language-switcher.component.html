@if (variant() === 'menu') {
  <button
    #trigger
    type="button"
    class="lang__trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    (click)="toggle()"
  >
    <app-flag [country]="current().flag" />
    <span class="visually-hidden">{{ i18n.t().a11y.changeLanguage }}: </span>
    <span [attr.lang]="current().htmlLang">{{ current().name }}</span>
    <svg class="lang__chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5" /></svg>
  </button>

  <ul [id]="panelId" class="lang__panel" role="list" [hidden]="!open()" [attr.aria-label]="i18n.t().a11y.languageSelector">
    <ng-container *ngTemplateOutlet="options" />
  </ul>
} @else {
  <ul class="lang__list" role="list" [attr.aria-label]="i18n.t().a11y.languageSelector">
    <ng-container *ngTemplateOutlet="options" />
  </ul>
}

<ng-template #options>
  @for (language of languages; track language.code) {
    <li>
      <a
        class="lang__option"
        [routerLink]="['/', language.code]"
        [attr.hreflang]="language.htmlLang"
        [attr.aria-current]="language.code === current().code ? 'page' : null"
        (click)="select()"
      >
        <span class="lang__label">
          <app-flag [country]="language.flag" />
          <span class="lang__name" [attr.lang]="language.htmlLang">{{ language.name }}</span>
        </span>
        <span class="lang__code" aria-hidden="true">{{ language.code }}</span>
      </a>
    </li>
  }
</ng-template>
