<section [id]="id" class="section section--alt" tabindex="-1" aria-labelledby="rituals-title">
  <div class="container">
    <header class="section-header section-header--center" appReveal>
      <p class="eyebrow">{{ t().rituals.eyebrow }}</p>
      <h2 id="rituals-title" class="section-title">{{ t().rituals.title }}</h2>
      <hr class="rule" />
      <p class="section-intro">{{ t().rituals.intro }}</p>
    </header>

    <ul class="bento" role="list">
      @for (item of t().rituals.items; track $index) {
        <li class="tile tile--{{ tones[$index] }}" appReveal>
          @if ($index === 0) {
            <app-media class="tile__photo" [asset]="photo" [alt]="t().rituals.imageAlt" [fill]="true" />
          } @else {
            <span class="tile__icon" aria-hidden="true">
              <svg viewBox="0 0 40 40">
                @switch ($index) {
                  @case (1) {
                    <!-- Cup with steam -->
                    <path d="M9 17h19v6a9 9 0 0 1-9 9h-1a9 9 0 0 1-9-9zM28 19h2.5a3.5 3.5 0 0 1 0 7H27" />
                    <path d="M15 12c-1.5-2 1.5-3 0-5M20 12c-1.5-2 1.5-3 0-5" class="accent" />
                  }
                  @case (2) {
                    <!-- Sourdough loaf -->
                    <path d="M6 26c0-8 6.5-13 14-13s14 5 14 13v1.5c0 1-.8 1.5-1.5 1.5h-25C6.8 29 6 28.5 6 27.5z" />
                    <path d="M13 18l3 4M19 16.5l2.5 5M25 17.5l2 4" class="accent" />
                  }
                  @case (3) {
                    <!-- Honey dipper -->
                    <path d="M8 32 20.5 19.5" />
                    <path d="M21 13.5a5 5 0 0 1 7.1 0l-.1.1a5 5 0 0 1 0 7.1l-.1.1a5 5 0 0 1-7.1 0 5 5 0 0 1 .2-7.3zM21.5 14.5l6 6M23 12.5l7 7" class="accent" />
                  }
                  @default {
                    <!-- Spoon -->
                    <path d="M25 6c4 0 6 3.5 4.5 7.5S24 19 21.5 17.5 18 10.5 20 8.2C21.2 6.8 23 6 25 6zM21.5 17.5 9 33" />
                    <path d="M24 10.5c1 0 2 .8 1.6 2" class="accent" />
                  }
                }
              </svg>
            </span>
          }
          <div class="tile__body">
            <h3 class="tile__title">{{ item.title }}</h3>
            <p class="tile__text">{{ item.text }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
