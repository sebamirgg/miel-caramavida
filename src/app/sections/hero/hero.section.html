<section [id]="id" class="hero honeycomb" tabindex="-1" aria-labelledby="hero-title">
  <!-- Warm backdrop: the hero photo itself, heavily blurred, under a cream veil. -->
  @if (media.src; as src) {
    <div class="hero__backdrop" [style.background-image]="'url(' + src + ')'" aria-hidden="true"></div>
  }
  <div class="hero__veil" aria-hidden="true"></div>

  <!-- Full-bleed photograph that dissolves into the page (no frame, no hard edges). -->
  <div class="hero__visual">
    <app-media class="hero__photo melt" [asset]="media" [alt]="t().hero.mediaLabel" [fill]="true" [priority]="true" />
    <app-wax-seal class="hero__seal" [text]="t().hero.seal" />
  </div>

  <div class="container hero__content">
    <div class="hero__copy">
      <p class="eyebrow">{{ t().hero.eyebrow }}</p>
      <h1 id="hero-title" class="hero__title">{{ t().hero.title }}</h1>
      <p class="hero__lead">{{ t().hero.lead }}</p>

      <div class="hero__ctas">
        <app-cta-link [label]="t().cta.exploreHarvest" [fragment]="honeysId" variant="accent" />
        <app-cta-link
          [label]="t().cta.requestCommercialDossier"
          [fragment]="partnershipsId"
          variant="outline"
          intent="dossier"
        />
      </div>

      <p class="hero__signature">
        <span class="hero__brand">{{ t().brand.name }}</span>
        <span class="hero__tagline">{{ t().brand.tagline }}</span>
      </p>
      <p class="hero__statement">{{ t().hero.statement }}</p>
    </div>
  </div>
</section>
