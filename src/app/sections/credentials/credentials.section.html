<section [id]="id" class="credentials" aria-labelledby="credentials-title">
  <div class="container">
    <h2 id="credentials-title" class="visually-hidden">{{ t().credentials.title }}</h2>

    <ul class="credentials__list" role="list">
      @for (item of t().credentials.items; track $index) {
        <li class="credential" appReveal>
          <span class="credential__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40">
              @switch ($index) {
                @case (0) {
                  <!-- Thermometer with a slash: no heat -->
                  <path d="M17 8a3 3 0 0 1 6 0v14.5a6 6 0 1 1-6 0z" />
                  <path d="M20 14v12" />
                  <path d="M7 33 33 7" class="accent" />
                }
                @case (1) {
                  <!-- Ulmo flower -->
                  <circle cx="20" cy="20" r="3.2" class="accent" />
                  <path d="M20 16.8c-3-6-1.5-10 0-11 1.5 1 3 5 0 11zM23.2 20c6-3 10-1.5 11 0-1 1.5-5 3-11 0zM20 23.2c3 6 1.5 10 0 11-1.5-1-3-5 0-11zM16.8 20c-6 3-10 1.5-11 0 1-1.5 5-3 11 0z" />
                }
                @case (2) {
                  <!-- Hive cells -->
                  <path d="M14 8.5 20 5l6 3.5v7L20 19l-6-3.5zM7.5 20 13.5 16.5l6 3.5v7l-6 3.5-6-3.5zM20.5 20l6-3.5 6 3.5v7l-6 3.5-6-3.5z" />
                  <path d="M26.5 20.8v5.6" class="accent" />
                }
                @default {
                  <!-- Crystal -->
                  <path d="M20 5 31 14 20 35 9 14z" />
                  <path d="M9 14h22M15 14l5 21 5-21M15 14l5-9 5 9" class="accent" />
                }
              }
            </svg>
          </span>
          <h3 class="credential__title">
            {{ item.title }}
            @if (item.example) {
              <span class="example-tag">{{ t().a11y.exampleTag }}</span>
            }
          </h3>
          <p class="credential__text">{{ item.text }}</p>
        </li>
      }
    </ul>

    @if (hasExamples()) {
      <p class="example-note credentials__note">{{ t().a11y.exampleNote }}</p>
    }
  </div>
</section>
